<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<header class="container-fluid bg-dark text-white p-3" th:replace="layout/header :: tablemanage"></header>
<body>
<div th:insert="~{layout/header::navbar-tablemanage}"></div>

<main class="container my-5">
    <!-- Header -->
    <h1 class="text-center mb-4">Table Management</h1>

    <!-- Filter Section (Re-styled) -->
    <div class="card p-4 mb-4">
        <form class="row g-3 align-items-end" method="get" th:action="@{/table/management}">
            <!-- Filter by Status -->
            <div class="col-12 col-md-4">
                <label for="status-filter" class="form-label">Filter by Status</label>
                <select id="status-filter" class="form-select" name="status">
                    <option value="">--All Status--</option>
                    <option th:selected="${status == 'available'}" value="available">Available</option>
                    <option th:selected="${status == 'booked'}" value="booked">Booked</option>
                    <option th:selected="${status == 'occupied'}" value="occupied">Occupied</option>
                </select>
            </div>

            <!-- Filter by Capacity -->
            <div class="col-12 col-md-4">
                <label for="capacity-filter" class="form-label">Filter by Capacity</label>
                <select id="capacity-filter" class="form-select" name="capacity">
                    <option value="">--All Capacity--</option>
                    <option th:each="x : ${capacityList}" th:selected="${x == capacity}" th:text="${x}"
                            th:value="${x}">${x}
                    </option>
                </select>
            </div>

            <div class="col-12 col-md-4">
                <button class="btn btn-brand-primary w-100" type="submit">Filter</button>
            </div>
        </form>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead>
                    <tr>
                        <th class="p-3" style="width: 20%">Table ID</th>
                        <th class="p-3" style="width: 30%">Capacity</th>
                        <th class="p-3" style="width: 20%">Edit Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="x : ${tables}">
                        <td class="p-3" th:text="${x.tableId}">..</td>
                        <td class="p-3" th:text="${x.capacity}+ ' people'">${x.customer.name}</td>
                        <td class="p-3">
                            <!-- Added .form-select class for proper styling -->
                            <select class="form-select table-status"
                                    name="status" th:data-id="${x.tableId}" th:value="${x.status}">
                                <option class="status-available" th:selected="${x.status == 'available'}"
                                        value="available">
                                    Available
                                </option>
                                <option class="status-booked" th:if="${x.status != 'occupied'}"
                                        th:selected="${x.status == 'booked'}" value="booked">Booked
                                </option>
                                <option class="status-occupied" th:if="${x.status != 'booked'}"
                                        th:selected="${x.status == 'occupied'}" value="occupied">Occupied
                                </option>
                            </select>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

<!-- Custom JS -->
<script>
    // --- Notification Toast Function (Replaces alert()) ---
    const toastEl = document.getElementById('notification-toast');
    const toastMessageEl = document.getElementById('notification-message');
    let toastTimeout;

    function showNotification(message, isError = false) {
        // Clear previous timeout
        if (toastTimeout) {
            clearTimeout(toastTimeout);
        }

        // Set message and style
        toastMessageEl.textContent = message;
        toastEl.className = 'notification-toast'; // Reset classes
        if (isError) {
            toastEl.classList.add('bg-danger');
        } else {
            toastEl.classList.add('bg-success');
        }

        // Show toast
        toastEl.classList.add('show');

        // Hide toast after 3 seconds
        toastTimeout = setTimeout(() => {
            toastEl.classList.remove('show');
        }, 3000);
    }

    // --- Your Original JS (Modified) ---

    // Function to set select color (using classes)
    function setSelectColor(select) {
        select.classList.remove('status-available', 'status-booked', 'status-occupied');
        if (select.value === 'available') {
            select.classList.add('status-available');
        } else if (select.value === 'booked') {
            select.classList.add('status-booked');
        } else if (select.value === 'occupied') {
            select.classList.add('status-occupied');
        }
    }

    document.querySelectorAll('.table-status').forEach(select => {
        // Set initial color on page load
        setSelectColor(select);

        // Add change listener
        select.addEventListener('change', function () {
            setSelectColor(this);
        });
    });

    // --- Fetch API Call (Modified to use Toast) ---
    const tokenEl = document.querySelector('meta[name="_csrf"]');
    const headerEl = document.querySelector('meta[name="_csrf_header"]');

    // Check if CSRF tokens exist before proceeding
    if (tokenEl && headerEl) {
        const token = tokenEl.content;
        const header = headerEl.content;

        document.querySelectorAll('.table-status').forEach(select => {
            select.addEventListener('change', function () {
                const tableId = this.dataset.id;
                const newStatus = this.value;

                fetch('/table/management/update-status', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        [header]: token
                    },
                    body: JSON.stringify({tableId: tableId, status: newStatus})
                })
                    .then(res => {
                        if (!res.ok) {
                            return res.text().then(text => {
                                throw new Error(text || 'Network response was not OK');
                            });
                        }
                        return res.text();
                    })
                    .then(msg => {
                        // Use toast notification for success
                        showNotification(msg, false);
                        // Reloading after 1 second to let user read the message
                        setTimeout(() => window.location.reload(), 1000);
                    })
                    .catch(err => {
                        // Use toast notification for error
                        showNotification('Error: ' + err.message, true);
                    });
            });
        });
    } else {
        console.error('CSRF meta tags not found. API calls will fail.');
    }
</script>

</body>
</html>
