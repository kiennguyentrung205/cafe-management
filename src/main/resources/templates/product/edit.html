<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1 th:text="${title}"></h1>
<form th:action="@{/product/edit}" method="post" th:object="${product}" enctype="multipart/form-data">
    <input type="hidden" th:field="*{proId}"/>

    <p>
        <label>Name: </label>
        <input type="text" th:field="*{proName}" required/>
    </p>

    <p style="border: 1px solid #ccc; padding: 10px;">
        <label>Image:</label>
        <br/>

        <strong style="display: block; margin-bottom: 5px;">Ảnh hiện tại:</strong>
        <img th:src="@{/uploads/{img}(img=*{img})}" width="100"
             style="border: 1px solid #ddd; padding: 2px; margin-bottom: 10px;" id="currentImage"/>

        <input type="file" id="fileInput" name="file" accept="image/*"/> <small style="display: block; color: gray;">*Chọn
        file mới để thay thế ảnh hiện tại.</small>

    <div id="imagePreviewContainer" style="display: none; margin-top: 10px;">
        <strong style="display: block; margin-bottom: 5px;">Ảnh mới (Preview):</strong>
        <img id="imagePreview" src="#" alt="Image Preview" width="100" style="border: 1px solid #ddd; padding: 2px;"/>
    </div>

    <input type="hidden" th:field="*{img}" id="imgField"/>
    </p>

    <p>
        <label>Price: </label>
        <input type="number" th:field="*{price}" min="1000" step="500"/>
    </p>

    <p>
        <label>Description: </label>
        <input type="text" th:field="*{description}"/>
    </p>

    <p>
        <label>Category: </label>
        <select th:field="*{category.cateId}">
            <option th:each="category : ${categoryList}"
                    th:value="${category.cateId}"
                    th:text="${category.cateName}">
            </option>
        </select>
    </p>

    <p>
        <label>Active: </label>
        <input type="checkbox" th:field="*{active}"/>
    </p>

    <p>
        <label>Status: </label>
        <select th:field="*{status}">
            <option value="Available">Available</option>
            <option value="Unavailable">Unavailable</option>
        </select>
    </p>

    <button type="submit"
            style="padding: 10px 20px; background-color: #007bff; color: white; border: none; cursor: pointer;">Submit
    </button>
    <button type="reset">Reset</button>
</form>


<script>
    // Lấy tham chiếu đến các phần tử HTML
    const fileInput = document.getElementById('fileInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const currentImage = document.getElementById('currentImage'); // Ảnh hiện tại từ DB

    // Lắng nghe sự kiện khi người dùng chọn một file
    fileInput.addEventListener('change', function (event) {
        const file = event.target.files[0]; // Lấy file đầu tiên được chọn

        if (file) {
            const reader = new FileReader(); // Tạo một FileReader

            reader.onload = function (e) {
                // Khi FileReader đọc xong file, set src của thẻ img preview
                imagePreview.src = e.target.result;
                imagePreviewContainer.style.display = 'block'; // Hiển thị khung preview
                currentImage.style.display = 'none'; // Ẩn ảnh hiện tại khi có preview mới
            };

            reader.readAsDataURL(file); // Đọc file dưới dạng URL dữ liệu (Base64)
        } else {
            // Nếu không có file nào được chọn, ẩn khung preview
            imagePreviewContainer.style.display = 'none';
            currentImage.style.display = 'block'; // Hiển thị lại ảnh hiện tại
            imagePreview.src = "#"; // Đặt lại src của preview
        }
    });
</script>
</body>
</html>
