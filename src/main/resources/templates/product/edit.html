<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
    <title>Title</title>
    <style>
        /* Tùy chỉnh nhỏ để căn chỉnh preview ảnh */
        .image-section img {
            max-width: 100%;
            height: auto;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-md-10">

            <h1 class="mb-4 text-primary" th:text="${title}">Edit Product Form</h1>

            <div class="card shadow-sm">
                <div class="card-body">

                    <form th:action="@{/product/edit}" method="post" th:object="${product}"
                          enctype="multipart/form-data">

                        <input type="hidden" th:field="*{proId}"/>

                        <div class="mb-3">
                            <label for="proName" class="form-label">Name:</label>
                            <input type="text" id="proName" th:field="*{proName}" class="form-control" required/>
                        </div>

                        <div class="mb-3 p-3 border rounded image-section">
                            <h5 class="card-title mb-3">Image Management</h5>

                            <div class="mb-3">
                                <label class="form-label d-block">Current Image:</label>
                                <img th:src="@{/uploads/{img}(img=*{img})}" width="150" class="img-thumbnail"
                                     id="currentImage"/>
                            </div>

                            <div class="mb-3">
                                <label for="fileInput" class="form-label">Upload New Image:</label>
                                <input type="file" id="fileInput" name="file" accept="image/*" class="form-control"/>
                                <small class="form-text text-muted">*Chọn file mới để thay thế ảnh hiện tại.</small>
                            </div>

                            <div id="imagePreviewContainer" style="display: none; margin-top: 15px;">
                                <label class="form-label d-block">New Image (Preview):</label>
                                <img id="imagePreview" src="#" alt="Image Preview" width="150" class="img-thumbnail"/>
                            </div>

                            <input type="hidden" th:field="*{img}" id="imgField"/>
                        </div>


                        <div class="mb-3">
                            <label for="price" class="form-label">Price (VND):</label>
                            <input type="number" id="price" th:field="*{price}" min="1000"
                                   class="form-control"/>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description:</label>
                            <textarea id="description" th:field="*{description}" class="form-control"
                                      rows="3"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="categorySelect" class="form-label">Category:</label>
                            <select id="categorySelect" th:field="*{category}" class="form-select">
                                <option th:each="category : ${categoryList}"
                                        th:value="${category.cateId}"
                                        th:text="${category.cateName}">
                                </option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <div class="form-check">
                                    <input type="checkbox" id="activeCheckbox" th:field="*{active}"
                                           class="form-check-input"/>
                                    <label class="form-check-label" for="activeCheckbox">Active</label>
                                </div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="statusSelect" class="form-label">Status:</label>
                                <input type="hidden" name="active" value="false"/>
                                <select id="statusSelect" th:field="*{status}" class="form-select">
                                    <option value="Available">Available</option>
                                    <option value="Unavailable">Unavailable</option>
                                </select>
                            </div>
                        </div>


                        <div class="d-flex justify-content-end mt-4">
                            <button type="reset" class="btn btn-secondary me-2">Reset</button>
                            <button type="submit" class="btn btn-primary">Submit</button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>
</div>


<script>
    // Lấy tham chiếu đến các phần tử HTML
    const fileInput = document.getElementById('fileInput');
    const imagePreviewContainer = document.getElementById('imagePreviewContainer');
    const imagePreview = document.getElementById('imagePreview');
    const currentImage = document.getElementById('currentImage');

    // Lắng nghe sự kiện khi người dùng chọn một file
    fileInput.addEventListener('change', function (event) {
        const file = event.target.files[0];

        if (file) {
            const reader = new FileReader();

            reader.onload = function (e) {
                // Hiển thị preview ảnh mới
                imagePreview.src = e.target.result;
                imagePreviewContainer.style.display = 'block';
                currentImage.style.display = 'none'; // Ẩn ảnh cũ
            };

            reader.readAsDataURL(file);
        } else {
            // Nếu không có file nào được chọn, ẩn khung preview và hiện lại ảnh cũ
            imagePreviewContainer.style.display = 'none';
            currentImage.style.display = 'block';
            imagePreview.src = "#";
        }
    });
</script>
</body>
</html>
