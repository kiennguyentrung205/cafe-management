<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: common-head(
            pageTitle='Product',
            pageSpecificCss=~{:: .page-css}
          )}"></head>
<th:block class="page-css">
    <link rel="stylesheet" href="/assets/css/dashboard/product/trash.css">
</th:block>
<body>
<div th:replace="~{fragments/common :: navbar-main}"></div>

<div class="container mt-4">
    <h1 class="mb-4" th:text="${title}">Danh sách sản phẩm</h1>

    <div class="row mb-4 align-items-center">
        <div class="col-md-4">
            <a class="btn btn-success mb-4" th:href="@{/product/create}">+ Create new product</a>
        </div>
        <div class="col-md-8">
            <form th:action="@{/product/deleted-list}" method="get" class="d-flex">
                <input type="text"
                       name="keyword"
                       class="form-control me-2"
                       placeholder="Nhập tên sản phẩm cần tìm..."
                       th:value="${keyword}" aria-label="Search">
                <button class="btn btn-outline-primary" type="submit">Search</button>
            </form>
        </div>
    </div>
    <hr>

    <div class="col-md-3">
        <h5 class="mb-3">Filter by Category:</h5>
        <form th:action="@{/product/deleted-list}" method="get">

            <input type="hidden" name="keyword" th:value="${keyword}"/>

            <div class="form-check">
                <input class="form-check-input" type="radio" name="categoryId" id="category-all" value="0"
                       th:checked="${selectedCategoryId == null || selectedCategoryId == 0}"
                       onchange="this.form.submit()">
                <label class="form-check-label" for="category-all">
                    -- All Categories --
                </label>
            </div>

            <div th:each="category : ${categoryList}" class="form-check">
                <input class="form-check-input" type="radio" name="categoryId"
                       th:id="'category-' + ${category.cateId}"
                       th:value="${category.cateId}"
                       th:checked="${category.cateId == selectedCategoryId}"
                       onchange="this.form.submit()">
                <label class="form-check-label"
                       th:for="'category-' + ${category.cateId}"
                       th:text="${category.cateName}">
                    Category Name
                </label>
            </div>
        </form>
    </div>

    <div class="col-md-9">
        <div th:if="${pageProduct.isEmpty()}" class="alert alert-info" role="alert">
            There are any products in the system
        </div>

        <div th:unless="${pageProduct.isEmpty()}">
            <div class="table-responsive">
                <table class="table table-striped table-bordered align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">#STT</th>
                        <th scope="col">Image</th>
                        <th scope="col">Product Name</th>
                        <th scope="col">Price</th>
                        <th scope="col">Category</th>
                        <th scope="col">Status</th>
                        <th scope="col">Active</th>
                        <th scope="col">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="product, i : ${pageProduct}" th:object="${product}">

                        <td th:text="${(pageProduct.number * pageProduct.size) + i.index + 1}">STT</td>

                        <td class="text-center">
                            <img th:src="@{/uploads/{img}(img=*{img})}"
                                 alt="Product Image"
                                 style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;"/>
                        </td>

                        <td th:text="*{proName}">Tên Sản Phẩm</td>

                        <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}"
                            class="text-end text-danger fw-bold">100.000 VNĐ
                        </td>

                        <td th:text="*{category.cateName}">Category Name</td>

                        <td>
                                <span th:if="*{status.equalsIgnoreCase('available')}"
                                      class="badge bg-success">Available</span>
                            <span th:if="*{status.equalsIgnoreCase('unavailable')}"
                                  class="badge bg-danger">Unavailable</span>
                        </td>

                        <td>
                            <span th:if="*{active}" class="badge bg-success">Yes</span>
                            <span th:unless="*{active}" class="badge bg-danger">No</span>
                        </td>

                        <td>
                            <div class="action-buttons">
                                <a class="btn btn-sm btn-primary" th:href="@{/product/edit/{id}(id=*{proId})}">Edit</a>

                                <form th:action="@{/product/delete/{id}(id=*{proId})}" method="post"
                                      style="display:inline;">
                                    <button class="btn btn-sm btn-danger"
                                            type="submit"
                                            onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này không?')">
                                        Delete
                                    </button>
                                </form>

                                <a class="btn btn-sm btn-warning"
                                   th:href="@{/product/{id}(id=*{proId})}">Details</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<div th:insert="~{layout/footer}"></div>
<div class="pagination-container" th:if="${pageProduct.getTotalPages() > 1}">
    <nav aria-label="Product Page Navigation">
        <ul class="pagination">
            <th:block th:with="
            currentPage=${pageProduct.getNumber() + 1},
            totalPages=${pageProduct.getTotalPages()},


            currentURL='/product/deleted-list',


            keywordParam=${keyword},
            categoryIdParam=${selectedCategoryId}
        ">

                <li class="page-item" th:classappend="${pageProduct.isFirst()} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="@{${currentURL}(
                       page=${currentPage - 1},
                       keyword=${keywordParam},
                       categoryId=${categoryIdParam}
                   )}">Previous</a>
                </li>

                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:classappend="${i == currentPage} ? 'active':''">
                    <a class="page-link"
                       th:href="@{${currentURL}(
                       page=${i},
                       keyword=${keywordParam},
                       categoryId=${categoryIdParam}
                   )}"
                       th:text="${i}"></a>
                </li>

                <li class="page-item" th:classappend="${pageProduct.isLast()} ? 'disabled'">
                    <a class="page-link"
                       th:href="@{${currentURL}(
                       page=${currentPage + 1},
                       keyword=${keywordParam},
                       categoryId=${categoryIdParam}
                   )}">Next</a>
                </li>
            </th:block>
        </ul>
    </nav>
</div>

</body>
</html>
