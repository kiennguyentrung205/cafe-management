<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Danh sách sản phẩm</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
    <style>
        /* CSS tùy chỉnh cho thẻ sản phẩm */
        .product-card {
            border: 1px solid #dee2e6;
            border-radius: 0.5rem; /* Bo góc nhẹ */
            margin-bottom: 25px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            height: 100%; /* Quan trọng để các thẻ đồng đều chiều cao */
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px); /* Hiệu ứng nâng nhẹ khi di chuột */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .card-img-container {
            background-color: #f8f9fa; /* Nền ảnh xám nhạt */
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 180px; /* Chiều cao cố định */
            border-bottom: 1px solid #eee;
        }

        .card-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-body {
            flex-grow: 1; /* Cho phép body mở rộng lấp đầy không gian */
        }

        .card-footer-actions {
            padding: 10px 15px;
            border-top: 1px solid #eee;
            background-color: #f8f9fa;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #343a40;
            min-height: 2.5rem; /* Giữ layout ổn định */
        }

        .product-price {
            font-weight: bold;
            color: #dc3545; /* Màu đỏ cho giá */
            font-size: 1.2rem;
        }

        .product-info p {
            margin-bottom: 0.2rem;
            font-size: 0.85rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="row">
    <h1 class="mb-4" th:text="${title}">Danh sách sản phẩm</h1>
    <div class="col-md-3">
        <h5 class="mb-3">Filter by Category:</h5>
        <form th:action="@{/product/deleted-list}" method="get">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="categoryId" id="category-all" value="0"
                       th:checked="${selectedCategoryId == null || selectedCategoryId == 0}"
                       onchange="this.form.submit()">
                <label class="form-check-label" for="category-all">
                    -- All Categories --
                </label>
            </div>

            <div th:each="category : ${categoryList}" class="form-check">
                <input class="form-check-input" type="radio" name="categoryId"
                       th:id="'category-' + ${category.cateId}"
                       th:value="${category.cateId}"
                       th:checked="${category.cateId == selectedCategoryId}"
                       onchange="this.form.submit()">
                <label class="form-check-label"
                       th:for="'category-' + ${category.cateId}"
                       th:text="${category.cateName}">
                    Category Name
                </label>
            </div>
        </form>
    </div>

    <div class="col-md-9">
        <div th:if="${productList.isEmpty()}" class="alert alert-info" role="alert">
            Không có sản phẩm nào trong danh sách.
        </div>
        <div th:unless="${productList.isEmpty()}">
            <table class="table table-striped table-bordered">
                <thead class="table-dark">
                <tr>
                    <th scope="col">#STT</th>
                    <th scope="col">Image</th>
                    <th scope="col">Product Name</th>
                    <th scope="col">Price</th>
                    <th scope="col">Category</th>
                    <th scope="col">Status</th>
                    <th scope="col">Active</th>
                    <th scope="col">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product, i : ${productList}" th:object="${product}">

                    <td th:text="${i.count}">1</td>

                    <td>
                        <img th:src="@{/uploads/{img}(img=*{img})}"
                             alt="Product Image"
                             style="width: 50px; height: 50px; object-fit: cover;"/>
                    </td>

                    <td th:text="*{proName}">Tên Sản Phẩm</td>

                    <td th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}">100.000</td>

                    <td th:text="*{category.cateName}">Category Name</td>

                    <td>
                            <span th:if="*{status.equalsIgnoreCase('available')}"
                                  class="badge bg-success">Available</span>
                        <span th:if="*{status.equalsIgnoreCase('unavailable')}"
                              class="badge bg-danger">Unavailable</span>
                    </td>

                    <td>
                        <span th:if="*{active}" class="badge bg-success">Yes</span>
                        <span th:unless="*{active}" class="badge bg-danger">No</span>
                    </td>

                    <td>
                        <a class="btn btn-sm btn-primary" th:href="@{/product/edit/{id}(id=*{proId})}">Edit</a>

                        <form th:action="@{/product/delete/{id}(id=*{proId})}" method="post"
                              style="display:inline; margin-left: 5px;">
                            <button class="btn btn-sm btn-danger"
                                    type="submit"
                                    onclick="return confirm('Bạn có chắc muốn xóa sản phẩm này không?')">
                                Delete
                            </button>
                        </form>
                    </td>

                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</div>
</body>
