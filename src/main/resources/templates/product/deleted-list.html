<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Danh sách sản phẩm</title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
    <style>
        /* CSS tùy chỉnh cho thẻ sản phẩm */
        .product-card {
            border: 1px solid #dee2e6;
            border-radius: 0.5rem; /* Bo góc nhẹ */
            margin-bottom: 25px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            height: 100%; /* Quan trọng để các thẻ đồng đều chiều cao */
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-5px); /* Hiệu ứng nâng nhẹ khi di chuột */
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .card-img-container {
            background-color: #f8f9fa; /* Nền ảnh xám nhạt */
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 180px; /* Chiều cao cố định */
            border-bottom: 1px solid #eee;
        }

        .card-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .card-body {
            flex-grow: 1; /* Cho phép body mở rộng lấp đầy không gian */
        }

        .card-footer-actions {
            padding: 10px 15px;
            border-top: 1px solid #eee;
            background-color: #f8f9fa;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #343a40;
            min-height: 2.5rem; /* Giữ layout ổn định */
        }

        .product-price {
            font-weight: bold;
            color: #dc3545; /* Màu đỏ cho giá */
            font-size: 1.2rem;
        }

        .product-info p {
            margin-bottom: 0.2rem;
            font-size: 0.85rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <h1 class="mb-4" th:text="${title}">Danh sách sản phẩm</h1>

    <div class="row mb-4">
        <div class="col-md-4">
            <form th:action="@{/product/deleted-list}" method="get">
                <label for="category-filter" class="form-label">Filter by Category:</label>
                <div class="input-group">

                    <select id="category-filter" name="categoryId" class="form-select">
                        <option value="0"
                                th:selected="${selectedCategoryId == null || selectedCategoryId == 0}">
                            -- All Categories --
                        </option>

                        <option th:each="category : ${categoryList}"
                                th:value="${category.cateId}"
                                th:text="${category.cateName}"

                                th:selected="${category.cateId == selectedCategoryId}">
                        </option>
                    </select>
                    <button type="submit" class="btn btn-primary">Filter</button>
                </div>
            </form>
        </div>
    </div>

    <div class="row">

        <div class="col-xl-3 col-lg-4 col-md-6 col-sm-6" th:each="product : ${productList}" th:object="${product}">

            <div class="product-card card shadow-sm">

                <div class="card-img-container">
                    <img th:src="@{/uploads/{img}(img=*{img})}" class="card-img" alt="Product Image"/>
                </div>

                <div class="card-body">
                    <h5 class="product-name" th:text="*{proName}">Tên Sản Phẩm</h5>

                    <p class="product-price mb-2" th:text="*{price}"> VND</p>

                    <div class="product-info">
                        <p><strong>Category:</strong> <span th:text="*{category.cateName}"></span></p>
                        <p><strong>Status:</strong> <span th:text="*{status}"></span></p>
                        <p><strong>Active:</strong>
                            <span th:if="*{active}" class="badge bg-success">Yes</span>
                            <span th:unless="*{active}" class="badge bg-danger">No</span>
                        </p>
                    </div>
                </div>

                <div class="card-footer-actions">
                    <a class="btn btn-sm btn-primary" th:href="@{/product/edit/{id}(id=*{proId})}">Edit</a>
                </div>

            </div>
        </div>
    </div>

</div>

</body>
</html>
