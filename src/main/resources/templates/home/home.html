<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ | Cafe Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .welcome-header {
            background-color: #e9ecef;
            border-radius: 0.5rem;
        }

        .list-group-item-action:hover {
            background-color: #eef5ff;
        }

        .list-icon {
            width: 30px; /* Cố định độ rộng của icon để các dòng chữ thẳng hàng */
        }
    </style>
</head>
<body>
<header class="container-fluid bg-dark text-white p-3" th:replace="layout/header :: header"></header>

<main class="container py-5">
    <div class="p-5 mb-4 text-center welcome-header">
        <h1 class="display-5 fw-bold">Xin chào, [[${name}]]!</h1>
        <p class="fs-5 text-muted">We hope you enjoy your experience</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="list-group shadow-sm">
                <a class="list-group-item list-group-item-action p-3" th:href="@{/table/list}">
                    <i class="fas fa-chair fa-fw me-3 text-primary list-icon"></i>
                    <strong>View Table</strong>
                </a>

                <a class="list-group-item list-group-item-action p-3" th:href="@{/table/booking/view-history}">
                    <i class="fas fa-cash-register fa-fw me-3 text-primary list-icon"></i>
                    <strong>Table Booking History</strong>
                </a>

                <a class="list-group-item list-group-item-action p-3" th:href="@{/logout}">
                    <i class="fas fa-cash-register fa-fw me-3 text-primary list-icon"></i>
                    <strong>Log out</strong>
                </a>

            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
