<!DOCTYPE html>
<html lang="vi" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ | Cafe Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>

    <style>
        body {
            background-color: #f8f9fa;
        }

        .welcome-header {
            background-color: #e9ecef;
            border-radius: 0.5rem;
        }

        .list-group-item-action:hover {
            background-color: #eef5ff;
        }

        .list-icon {
            width: 30px; /* Cố định độ rộng của icon để các dòng chữ thẳng hàng */
        }
    </style>
</head>
<body>
<header class="container-fluid bg-dark text-white p-3" th:replace="layout/header :: header"></header>

<main class="container py-5">
    <div class="p-5 mb-4 text-center welcome-header">
        <h1 class="display-5 fw-bold">Xin chào, [[${name}]]!</h1>
        <p class="fs-5 text-muted">We hope you enjoy your experience</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="list-group shadow-sm">
                <a class="list-group-item list-group-item-action p-3" th:href="@{/table/list}">
                    <i class="fas fa-chair fa-fw me-3 text-primary list-icon"></i>
                    <strong>View Table</strong>
                </a>

                <a class="list-group-item list-group-item-action p-3" th:href="@{/table/booking/my}">
                    <i class="fas fa-cash-register fa-fw me-3 text-primary list-icon"></i>
                    <strong>Table Booking History</strong>
                </a>

                <form class="list-group-item list-group-item-action p-3" th:action="@{/logout}" method="post">
                    <i class="fas fa-cash-register fa-fw me-3 text-primary list-icon"></i>
                    <button type="submit" class="list-group-item-action border-0"><strong>Log out</strong></button>
                </form>

                <a class="list-group-item list-group-item-action p-3" sec:authorize="hasRole('ROLE_CASHIER')"
                   th:href="@{/table/booking/management}">
                    <i class="fas fa-cash-register fa-fw me-3 text-primary list-icon"></i>
                    <strong>Booking History</strong>
                </a>

                <a class="list-group-item list-group-item-action p-3" sec:authorize="hasAnyRole('ROLE_CASHIER', 'ROLE_WAITER')"
                   th:href="@{/table/management}">
                    <i class="fas fa-cash-register fa-fw me-3 text-primary list-icon"></i>
                    <strong>Table Management</strong>
                </a>

            </div>
        </div>
    </div>
</main>

<div aria-hidden="true" aria-labelledby="successModalLabel" class="modal fade" id="successModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title" id="successModalLabel">Success</h5>
                <button aria-label="Close" class="btn-close" data-bs-dismiss="modal" type="button"></button>
            </div>

            <div class="modal-body">
                <div class="alert alert-danger" role="alert">
                    <span th:text="${completeInfo}">ok</span>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn btn-danger" data-bs-dismiss="modal" type="button">Close</button>
            </div>
        </div>
    </div>
</div>


<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {
        const hasSuccess = /*[[${completeInfo != null}]]*/ false;
        if (hasSuccess) {
            const modal = new bootstrap.Modal(document.getElementById('successModal'));
            modal.show();
        }
    });
</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
