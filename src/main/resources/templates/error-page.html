<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title ?: 'Lỗi Ứng Dụng'}"></title>
    <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}">
    <style>
        .error-container {
            padding: 60px 15px;
            text-align: center;
        }

        .error-icon {
            font-size: 5rem;
            color: #dc3545; /* Màu đỏ của Bootstrap */
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="error-container">

                <div class="error-icon">
                    <i class="bi bi-exclamation-triangle-fill"></i> &#9888;
                </div>

                <h1 class="display-4 text-danger" th:text="${title ?: 'Rất Tiếc, Đã Xảy Ra Lỗi!'}">Lỗi Ứng Dụng</h1>

                <p class="lead"
                   th:text="${errorMessage ?: 'Một vấn đề không mong muốn đã xảy ra. Vui lòng thử lại hoặc liên hệ quản trị viên.'}">
                    Thông tin không nhất quán hoặc sản phẩm không tồn tại.
                </p>

                <hr class="my-4">

                <p>
                    <a th:href="@{/product/list}" class="btn btn-primary btn-lg mt-2">
                        <i class="bi bi-list"></i> Về Danh Sách Sản Phẩm
                    </a>
                    <a th:href="@{/}" class="btn btn-secondary btn-lg mt-2">
                        <i class="bi bi-house-door-fill"></i> Về Trang Chủ
                    </a>
                </p>

<!--                <div th:if="${trace}" class="mt-4 text-start p-3 bg-light border rounded">-->
                <!--                    <strong>Thông tin kỹ thuật (chỉ cho quản trị viên):</strong>-->
                <!--                    <pre th:text="${trace}"></pre>-->
                <!--                </div>-->

            </div>
        </div>
    </div>
</div>

</body>
</html>
