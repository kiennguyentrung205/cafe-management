<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: common-head(
            pageTitle='Login',
            pageSpecificCss=~{:: .page-css}
          )}"></head>
<th:block class="page-css">
    <link rel="stylesheet" href="/assets/css/account/login.css">
</th:block>
<body>
<div th:replace="~{fragments/common :: navbar-guest}"></div>

<!-- Page Content -->
<div class="container-fluid main-content px-3">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-md-6 col-lg-5">

            <!-- Unified Card for the form -->
            <div class="card auth-card">
                <div class="card-body p-4 p-md-4">
                    <!-- Logo -->
                    <div class="text-center mb-3">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/3/3d/Highlands_Coffee_5G.svg"
                             alt="FPT Logo"
                             style="height: 60px; width: auto;">
                    </div>
                    <h2 class="text-center auth-card-title mb-2">Welcome Customer</h2>
                    <p class="text-center auth-card-subtitle mb-4">
                        Login to your account as Customer
                    </p>

                    <!-- Form with Thymeleaf attributes preserved -->
                    <form th:action="@{/login}" method="post">
                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Your username" required>
                        </div>
                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="••••••••" required>
                        </div>
                        <!-- Remember me & Forgot password -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                                <label class="form-check-label" for="rememberMe" style="font-size: 0.9em;">Remember
                                    me</label>
                            </div>
                            <a href="/forgot-password" class="auth-link" style="font-size: 0.9em;">Forgot password?</a>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-brand-primary">Login</button>
                            <a class="btn btn-outline-google w-100"
                               href="/oauth2/authorization/google">
                                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"
                                     height="20" alt="Google icon">
                                Log in with Google
                            </a>
                        </div>
                    </form>

                    <!-- Divider -->
                    <div class="auth-divider my-4">OR</div>

                    <!-- Google Login -->
                    <!--                    <a class="btn btn-outline-google w-100"-->
                    <!--                       href="/oauth2/authorization/google">-->
                    <!--                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"-->
                    <!--                             height="20" alt="Google icon">-->
                    <!--                        Log in with Google-->
                    <!--                    </a>-->
                    <!--                    -->
                    <a class="btn btn-outline-google w-100"
                       href="/oauth2/authorization/google">
                        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"
                             height="20" alt="Google icon">
                        Log in as Manager
                    </a>

                    <!-- Extra links -->
                    <div class="mt-4 text-center">
                        <span class="text-muted">Don't have an account?</span>
                        <a href="/register" class="auth-link ms-1">Create one</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
<div th:insert="~{layout/footer}"></div>

<!-- Bootstrap 5.3.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
