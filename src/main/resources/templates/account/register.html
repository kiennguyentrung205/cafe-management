<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* A simple gradient background like the example */
        .gradient-custom {
            background: #8b5b13;
            background: -webkit-linear-gradient(to bottom right, rgb(139, 91, 19), rgb(255, 249, 249));
            background: linear-gradient(to bottom right, rgb(139, 91, 19), rgb(255, 255, 255))
        }
    </style>
</head>
<body>
<section class="vh-100 gradient-custom">
    <div class="container py-5 h-100">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col-12 col-lg-9 col-xl-8">
                <div class="card shadow-2-strong" style="border-radius: 15px;">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 text-center">Registration Form</h3>
                        <form th:action="@{/register}" th:object="${customer}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <div class="form-outline">
                                        <label class="form-label" for="fullName">Full Name</label>
                                        <input class="form-control form-control-lg" th:field="*{name}" id="fullName" required type="text"/>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <div class="form-outline">
                                        <label class="form-label" for="username">Username</label>
                                        <input class="form-control form-control-lg" th:field="*{username}" id="username" required type="text"/>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <div class="form-outline">
                                        <label class="form-label" for="email">Email</label>
                                        <input class="form-control form-control-lg" th:field="*{email}" id="email" required type="email"/>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <div class="form-outline">
                                        <label class="form-label" for="phoneNumber">Phone number</label>
                                        <input class="form-control form-control-lg" th:field="*{phoneNumber}" id="phoneNumber" required
                                               type="tel"/>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-12 mb-4">
                                    <div class="form-outline">
                                        <label class="form-label" for="birthdate">Birthdate</label>
                                        <input class="form-control form-control-lg" th:field="*{dateOfBirth}" id="birthdate" required
                                               type="date"/>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-4">
                                    <div class="form-outline">
                                        <label class="form-label" for="password">Password</label>
                                        <input class="form-control form-control-lg" th:field="*{password}" id="password" required
                                               type="password"/>
                                    </div>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <div class="form-outline">
                                        <label class="form-label" for="confirmPassword">Confirm Password</label>
                                        <input class="form-control form-control-lg" id="confirmPassword" required
                                               type="password"/>
                                    </div>
                                </div>
                                <div id="passwordError" class="text-danger mt-2" style="display: none;">
                                    Passwords do not match!
                                </div>
                            </div>

                            <div class="mt-4 pt-2 text-center">
                                <input class="btn btn-primary btn-lg" type="submit" value="Register"/>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Popup thông báo lỗi -->
        <div th:if="${errorMessage}" class="modal fade show" style="display:block;" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content text-center p-4">
                    <h5 class="text-danger mb-3">Error</h5>
                    <p th:text="${errorMessage}"></p>
                    <button class="btn btn-danger mt-2" onclick="closePopup()">Close</button>
                </div>
            </div>
        </div>


    </div>
</section>

<script>
    const password = document.getElementById("password");
    const confirmPassword = document.getElementById("confirmPassword");
    const errorMsg = document.getElementById("passwordError");

    function validatePassword() {
        if (confirmPassword.value.trim() === "") {
            errorMsg.style.display = "none";
            confirmPassword.classList.remove("is-invalid", "is-valid");
            return;
        }

        if (password.value === confirmPassword.value) {
            errorMsg.style.display = "none";
            confirmPassword.classList.remove("is-invalid");
            confirmPassword.classList.add("is-valid");
        } else {
            errorMsg.style.display = "block";
            confirmPassword.classList.remove("is-valid");
            confirmPassword.classList.add("is-invalid");
        }
    }

    // kiểm tra khi người dùng nhập
    password.addEventListener("input", validatePassword);
    confirmPassword.addEventListener("input", validatePassword);

    // chặn submit nếu sai
    document.querySelector("form").addEventListener("submit", function (e) {
        if (password.value !== confirmPassword.value) {
            e.preventDefault();
            errorMsg.style.display = "block";
            confirmPassword.classList.add("is-invalid");
        }
    });
</script>


<script>
    function closePopup() {
        document.querySelector('.modal').style.display = 'none';
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
