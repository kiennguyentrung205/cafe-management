<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/frag :: acclogin}"></head>
<body>
<div th:insert="~{fragment/frag::navbar-acclogin}"></div>

<div class="container-fluid main-content d-flex align-items-center justify-content-center min-vh-100 py-2">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">

            <div class="card auth-card shadow-lg border-0">
                <div class="card-body p-3">

                    <div class="text-center mb-2">
                        <img src="https://fpt.com/-/media/project/fpt-corporation/fpt/common/images/navigation/logo/fpt-logo.svg"
                             alt="FPT Logo"
                             style="height: 40px; width: auto;"> <h5 class="text-center auth-card-title mb-0 fw-bold mt-2">Welcome Customer</h5>
                        <p class="text-center auth-card-subtitle text-muted mb-0" style="font-size: 0.85rem;">
                            Login to your account
                        </p>
                    </div>

                    <form th:action="@{/customer/login}" method="post">
                        <div class="mb-2">
                            <label for="username" class="form-label fw-semibold" style="font-size: 0.9rem;">Username</label>
                            <input type="text" class="form-control form-control-sm" id="username" name="username"
                                   placeholder="Your username" required>
                        </div>
                        <div class="mb-2">
                            <label for="password" class="form-label fw-semibold" style="font-size: 0.9rem;">Password</label>
                            <input type="password" class="form-control form-control-sm" id="password" name="password"
                                   placeholder="••••••••" required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                                <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.8em;">
                                    Remember me
                                </label>
                            </div>
                            <a href="/forgot-password" class="auth-link text-decoration-none" style="font-size: 0.8em;">
                                Forgot password?
                            </a>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-brand-primary fw-bold">Login</button>

                            <a class="btn btn-outline-google w-100 d-flex align-items-center justify-content-center"
                               href="/oauth2/authorization/google">
                                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"
                                     height="20" alt="Google icon" class="me-2">
                                Log in with Google
                            </a>
                        </div>
                    </form>

                    <div class="auth-divider my-3 text-center text-muted" style="font-size: 0.8em;">
                        — OR —
                    </div>

                    <div class="d-grid">
                        <a class="btn btn-warning fw-semibold"
                           href="/staff/login">
                            Log in as Manager
                        </a>
                    </div>


                    <div class="mt-3 pt-2 text-center border-top">
                        <span class="text-muted" style="font-size: 0.85em;">Don't have an account?</span>
                        <a href="/register" class="auth-link fw-semibold ms-1 text-decoration-none" style="font-size: 0.85em;">
                            Create one
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
