<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: common-head(
            pageTitle='Login',
            pageSpecificCss=~{:: .page-css}
          )}"></head>
<th:block class="page-css">
    <link rel="stylesheet" href="/assets/css/account/login.css">
</th:block>
<body>
<div th:replace="~{fragments/common :: navbar-guest}"></div>

<div class="container-fluid main-content d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-sm-8 col-md-6 col-lg-5 col-xl-4">

            <div class="card auth-card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <img src="https://fpt.com/-/media/project/fpt-corporation/fpt/common/images/navigation/logo/fpt-logo.svg"
                             alt="FPT Logo"
                             style="height: 50px; width: auto; margin-bottom: 0.5rem;">
                        <h3 class="text-center auth-card-title mb-1 fw-bold">Login Staff</h3>
                        <p class="text-center auth-card-subtitle text-muted mb-0" style="font-size: 0.95rem;">
                            Access your management account
                        </p>
                    </div>

                    <form th:action="@{/staff/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username"
                                   placeholder="Your username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password"
                                   placeholder="••••••••" required>
                        </div>

                        <div class="center mb-4">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                                <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.9em;">
                                    Remember me
                                </label>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mb-4">
                            <button type="submit" class="btn btn-brand-primary btn-lg fw-bold">Login</button>
                        </div>
                    </form>

                    <div class="auth-divider my-4 text-center text-muted" style="font-size: 0.85em;">
                        — OR —
                    </div>

                    <div class="d-grid">
                        <a class="btn btn-warning btn-lg fw-semibold"
                           href="/customer/login">
                            Log in as Customer
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
