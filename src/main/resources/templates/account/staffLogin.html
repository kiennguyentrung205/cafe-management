<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragment/frag :: acclogin}"></head>
<body>
<div th:insert="~{fragment/frag::navbar-acclogin}"></div>

<!-- Page Content -->
<div class="container-fluid main-content px-3">
    <div class="row justify-content-center w-100">
        <div class="col-12 col-md-6 col-lg-5">

            <!-- Unified Card for the form -->
            <div class="card auth-card">
                <div class="card-body p-4 p-md-4">
                    <!-- Logo -->
                    <div class="text-center mb-3">
                        <img src="https://fpt.com/-/media/project/fpt-corporation/fpt/common/images/navigation/logo/fpt-logo.svg"
                             alt="FPT Logo"
                             style="height: 60px; width: auto;">
                    </div>
                    <h2 class="text-center auth-card-title mb-2">Login Staff</h2>


                    <!-- Form with Thymeleaf attributes preserved -->
                    <form th:action="@{/staff/login}" method="post">
                        <!-- Username -->
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Your username" required>
                        </div>
                        <!-- Password -->
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="••••••••" required>
                        </div>
                        <!-- Remember me & Forgot password -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="rememberMe" name="remember-me">
                                <label class="form-check-label" for="rememberMe" style="font-size: 0.9em;">Remember
                                    me</label>
                            </div>
                            <a href="/forgot-password" class="auth-link" style="font-size: 0.9em;">Forgot password?</a>
                        </div>

                        <!-- Submit -->
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-brand-primary">Login</button>
                        </div>
                    </form>

                    <!-- Extra links -->
                    <a class="btn btn-warning"
                       href="/customer/login">
                        Log in as Customer
                    </a>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5.3.3 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
