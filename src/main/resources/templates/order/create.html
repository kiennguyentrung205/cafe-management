<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create In-Store Order</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f8f9fa;
            margin: 20px;
        }
        h2 { margin-bottom: 10px; }
        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .menu-panel, .order-panel {
            background: #fff; border-radius: 10px; padding: 15px;
            box-shadow: 0 0 6px rgba(0,0,0,0.1);
        }
        .menu-header { display: flex; justify-content: space-between; align-items: center; }
        .search-bar input {
            padding: 6px 10px; border: 1px solid #ccc; border-radius: 5px;
            width: 200px;
        }
        .categories button {
            border: none; background-color: #ddd; padding: 6px 15px; margin-right: 8px;
            border-radius: 5px; cursor: pointer;
        }
        .categories button:hover { background-color: #bbb; }
        .menu-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            margin-top: 15px;
        }
        .product-card {
            border: 1px solid #ddd; border-radius: 8px; padding: 10px;
            text-align: center; cursor: pointer;
        }
        .product-card img {
            width: 100%; height: 100px; object-fit: cover; border-radius: 6px;
        }
        .product-card:hover { background-color: #f0f0f0; }

        .order-panel h3 { margin-bottom: 10px; }
        .order-list {
            border-top: 1px solid #ccc; border-bottom: 1px solid #ccc;
            padding: 8px 0; max-height: 200px; overflow-y: auto;
        }
        .order-item {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px;
        }
        .order-item img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; margin-right: 8px; }
        .voucher, .customer-info { margin-top: 15px; }
        .redeem {
            display: flex; align-items: center; gap: 10px; margin-top: 5px;
        }
        button {
            background-color: #007bff; color: white;
            border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        .place-container {
            display: flex;
            justify-content: center; /* căn giữa nút Place */
            align-items: center;
            margin-top: 15px;
        }

        .place-btn {
            background-color: #ff0000;
            color: #fff;
            padding: 12px 40px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            transition: 0.2s ease-in-out;
        }

        .place-btn:hover {
            background-color: #ff0000;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<h2>Create In-Store Order</h2>

<form th:action="@{/order/create}" method="post">
    <div class="container">

        <!-- LEFT PANEL: Menu -->
        <div class="menu-panel">
            <div class="menu-header">
                <div class="categories"><h3>Menu Category</h3>
                    <button type="button">Coffee</button>
                    <button type="button">Tea</button>
                    <button type="button">Latte</button>
                </div>
                <div class="search-bar">
                    <input type="text" placeholder="Search..." />
                </div>
            </div>

            <div class="menu-grid">
                <div th:each="p : ${productList}" class="product-card">
                    <img th:src="${p.img}" th:alt="${p.proName}">
                    <p th:text="${p.proName}"></p>
                    <p><b th:text="${p.price} + ' VND'"></b></p>
                    <input type="checkbox" name="productIds" th:value="${p.proId}" />
                    <input type="number" name="quantities" min="1" value="1" style="width:50px;">
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Order -->
        <div class="order-panel">
            <h3>Order Menu</h3>
            <div class="order-list">
                <div th:each="p : ${productList}" class="order-item" th:if="${p.selected}">
                    <img th:src="${p.img}" th:alt="${p.proName}">
                    <span th:text="${p.proName}"></span>
                    <span th:text="${p.price} + ' VND'"></span>
                </div>
            </div>

            <div class="voucher">
                <label>Voucher:</label>
                <select name="voucherId">
                    <option value="">None</option>
                    <option th:each="v : ${voucherList}" th:value="${v.voucherId}" th:text="${v.voucherName}"></option>
                </select>
            </div>

            <div class="customer-info">
                <label>Phone Number:</label>
                <input type="text" name="customerPhone" placeholder="0123456789" required>

                <h4>Customer Info</h4>
                <p>Username: <span th:text="${customer != null ? customer.username : '-'}"></span></p>
                <p>Point: <span th:text="${customer != null ? customer.point : 0}"></span></p>

                <div class="redeem">
                    <label>Redeem Points:</label>
                    <button type="button" onclick="changePoint(-5)">-</button>
                    <input type="number" name="pointsUsed" id="pointsUsed"
                           value="0" min="0" step="5" readonly
                           th:attr="data-max=${customer != null ? customer.point : 0}">
                    <button type="button" onclick="changePoint(5)">+</button>
                </div>
            </div>

            <hr/>
            <div class="place-container">
                <button type="submit" class="place-btn">
                    <span style="font-size: 18px; font-weight: 600;">Place</span><br>
                    <span style="font-size: 14px;">(<span id="totalPrice">0</span> VND)</span>
                </button>
            </div>
        </div>
    </div>
</form>

<script src="/assets/js/bootstrap.bundle.min.js"></script>
<script>
    function changePoint(delta) {
        const input = document.getElementById('pointsUsed');
        const maxPoint = parseInt(input.getAttribute('data-max')) || 0; // tổng point của khách
        let current = parseInt(input.value) || 0;

        // cộng/trừ điểm
        current += delta;

        // không được âm hoặc vượt quá maxPoint
        if (current < 0) current = 0;
        if (current > maxPoint) current = maxPoint;

        // làm tròn về bội 5 gần nhất
        current = Math.floor(current / 5) * 5;

        input.value = current;
    }
</script>
</body>
</html>
