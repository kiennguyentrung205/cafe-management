<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Order</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* === SIDEBAR === */
        .sidebar {
            width: 120px;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            gap: 10px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            background-color: #f5f5f5;
            padding: 10px 0;
            width: 100px;
            border-radius: 15px;
            font-size: 12px;
            transition: 0.25s;
            text-align: center;
        }

        .menu-item i {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .menu-item:hover {
            background-color: #ff4d4d;
            color: white;
            transform: scale(1.05);
        }

        .menu-item.active {
            background-color: #ff4d4d;
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
            margin-bottom: 20px;
        }

        /* === MAIN CONTENT === */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            background-color: white;
            overflow: hidden;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #e6e6e6;
            padding: 10px;
            text-align: center;
        }

        td {
            text-align: center;
            padding: 10px;
            vertical-align: middle;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .pagination a {
            color: #007bff;
            padding: 6px 12px;
            margin: 0 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-decoration: none;
        }

        .pagination a.active {
            background-color: #007bff;
            color: white;
        }

        .pagination a:hover {
            background-color: #0056b3;
            color: white;
        }

        .status-completed {
            color: green;
            font-weight: bold;
        }

        .status-inprogress {
            color: orange;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- === Sidebar === -->
<div class="sidebar">
    <a href="/dashboard" class="menu-item active">
        <i class="bi bi-house-door"></i>
        <span>Dashboard</span>
    </a>

    <div class="sidebar-bottom">
        <a href="/logout" class="menu-item logout">
            <i class="bi bi-box-arrow-right"></i>
            <span>Log Out</span>
        </a>
    </div>
</div>

<!-- === Main Content === -->
<div class="main-content">
    <h2>Edit Order</h2>

    <table>
        <thead>
        <tr>
            <th>Order#</th>
            <th>Status</th>
            <th>Role ID</th>
            <th>Updated At</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.orderId}"></td>
            <td>
                <span th:text="${order.status}" th:classappend="${order.status == 'Completed'} ? 'status-completed' : 'status-inprogress'"></span>
            </td>
            <td th:text="${order.roleId}"></td>
            <td th:text="${#dates.format(order.updatedAt, 'dd/MM/yyyy HH:mm')}"></td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination">
        <a th:href="@{/order/view(page=1)}">&lt;&lt;</a>
        <a th:each="i : ${#numbers.sequence(1, totalPages)}"
           th:href="@{/order/view(page=${i})}"
           th:text="${i}"
           th:classappend="${i == currentPage} ? 'active' : ''"></a>
        <a th:href="@{/order/view(page=${totalPages})}">&gt;&gt;</a>
    </div>

</div>

<script>
    // Function to close the popup (if needed in the future)
    function closePopup() {
        document.getElementById('order-details-popup').style.display = 'none';
    }
</script>

</body>
</html>
