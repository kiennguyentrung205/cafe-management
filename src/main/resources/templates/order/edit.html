<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Order</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 120px;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            gap: 10px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            background-color: #f5f5f5;
            padding: 10px 0;
            width: 100px;
            border-radius: 15px;
            font-size: 12px;
            transition: 0.25s;
            text-align: center;
        }

        .menu-item i {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .menu-item:hover {
            background-color: #ff4d4d;
            color: white;
            transform: scale(1.05);
        }

        .menu-item.active {
            background-color: #ff4d4d;
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
            margin-bottom: 20px;
        }

        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            background-color: white;
            overflow: hidden;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #e6e6e6;
            padding: 10px;
            text-align: center;
        }

        td {
            text-align: center;
            padding: 10px;
            vertical-align: middle;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .pagination a {
            color: #007bff;
            padding: 6px 12px;
            margin: 0 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-decoration: none;
        }

        .pagination a.active {
            background-color: #007bff;
            color: white;
        }

        .pagination a:hover {
            background-color: #0056b3;
            color: white;
        }

        .form-control-sm {
            width: 180px;
            margin: auto;
        }
    </style>
</head>
<body>

<!-- === Sidebar === -->
<div class="sidebar">
    <a href="/dashboard" class="menu-item active">
        <i class="bi bi-house-door"></i>
        <span>Dashboard</span>
    </a>

    <div class="sidebar-bottom">
        <a href="/logout" class="menu-item logout">
            <i class="bi bi-box-arrow-right"></i>
            <span>Log Out</span>
        </a>
    </div>
</div>

<!-- === Main Content === -->
<div class="main-content">
    <h2>Edit Order</h2>

    <table>
        <thead>
        <tr>
            <th>Order#</th>
            <th>Status</th>
            <th>Note</th>
            <th>Role</th>
            <th>Updated At</th>
        </tr>
        </thead>

        <tbody>
        <form th:action="@{/order/updateStatus}" method="post" th:each="order : ${orders}">
            <tr>
                <td th:text="${order.orderId}"></td>

                <td>
                    <input type="hidden" name="orderId" th:value="${order.orderId}" />
                    <select name="status" class="form-select form-select-sm me-2">
                        <option value="pending"
                                th:selected="${order.status == null or order.status == 'pending'}">
                            Pending
                        </option>
                        <option value="served"
                                th:selected="${order.status == 'served'}">
                            Served
                        </option>
                        <option value="canceled"
                                th:selected="${order.status == 'canceled'}">
                            Canceled
                        </option>
                    </select>
                </td>

                <td th:text="${order.orderItems != null && !order.orderItems.isEmpty()
                          ? order.orderItems[0].note : '-'}"></td>

                <td th:text="${currentUser != null && currentUser.role != null
                          ? currentUser.role.roleName : 'N/A'}"></td>

                <td>
                    <input type="datetime-local"
                           th:value="${#temporals.format(order.updatedAt, 'yyyy-MM-dd''T''HH:mm')}" />
                    <button type="submit" class="btn btn-sm btn-primary mt-1">Save</button>
                </td>
            </tr>
        </form>
        </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination">
        <a th:href="@{/order/edit(page=1)}">&lt;&lt;</a>
        <a th:each="i : ${#numbers.sequence(1, totalPages)}"
           th:href="@{/order/edit(page=${i})}"
           th:text="${i}"
           th:classappend="${i == currentPage ? 'active' : ''}">
        </a>
        <a th:href="@{/order/edit(page=${totalPages})}">&gt;&gt;</a>
    </div>
</div>

</body>
</html>
