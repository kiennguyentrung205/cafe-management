<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Order</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 120px;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            gap: 10px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            background-color: #f5f5f5;
            padding: 10px 0;
            width: 100px;
            border-radius: 15px;
            font-size: 12px;
            transition: 0.25s;
            text-align: center;
        }

        .menu-item i {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .menu-item:hover {
            background-color: #ff4d4d;
            color: white;
            transform: scale(1.05);
        }

        .menu-item.active {
            background-color: #ff4d4d;
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
            margin-bottom: 20px;
        }

        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        table {
            width: 100%;
            background-color: white;
            overflow: hidden;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #e6e6e6;
            padding: 10px;
            text-align: center;
        }

        td {
            text-align: center;
            padding: 10px;
            vertical-align: middle;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .pagination a {
            color: #007bff;
            padding: 6px 12px;
            margin: 0 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-decoration: none;
        }

        .pagination a.active {
            background-color: #007bff;
            color: white;
        }

        .pagination a:hover {
            background-color: #0056b3;
            color: white;
        }

        .form-control-sm {
            width: 180px;
            margin: auto;
        }
    </style>
</head>
<body>

<!-- === Sidebar === -->
<div class="sidebar">
    <a href="/dashboard" class="menu-item active">
        <i class="bi bi-house-door"></i>
        <span>Dashboard</span>
    </a>

    <div class="sidebar-bottom">
        <a href="/logout" class="menu-item logout">
            <i class="bi bi-box-arrow-right"></i>
            <span>Log Out</span>
        </a>
    </div>
</div>

<!-- === Main Content === -->
<div class="main-content">
    <h2>Edit Order</h2>

    <table>
        <thead>
        <tr>
            <th>Order#</th>
            <th>Status</th>
            <th>Note</th>
            <th>Barista</th>
            <th>Updated At</th>
        </tr>
        </thead>

        <tbody>
        <form th:action="@{/order/updateStatus}" method="post"
              th:each="order : ${orders}"
              th:if="${order.status != 'Served' and order.status != 'Canceled'}">
            <tr>
                <td th:text="${order.orderId}"></td>

                <td>
                    <input type="hidden" name="orderId" th:value="${order.orderId}" />
                    <select name="status" class="form-select form-select-sm me-2">
                        <option value="Served"
                                th:selected="${order.status == 'Served'}">Served</option>
                        <option value="Canceled"
                                th:selected="${order.status == 'Canceled'}">Canceled</option>
                    </select>
                </td>

                <td th:text="${order.orderItems != null && !order.orderItems.isEmpty()
                  ? order.orderItems[0].note : '-'}"></td>

                <td th:text="${order.manager != null ? order.manager.name : '-'}"></td>


                <td>
                    <input type="hidden" name="updatedAt" class="updatedAtInput" />
                    <button type="submit" class="btn btn-sm btn-primary mt-1">Save</button>
                </td>
            </tr>
        </form>
        </tbody>
    </table>

    <!-- Pagination -->
    <nav aria-label="Order pagination">
        <ul class="pagination justify-content-center">
            <!-- Previous -->
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/order/edit(page=${currentPage - 1})}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <!-- Page numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/order/edit(page=${i})}" th:text="${i}"></a>
            </li>

            <!-- Next -->
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/order/edit(page=${currentPage + 1})}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const today = new Date();

        // Lấy phần ngày hôm nay (YYYY-MM-DD)
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, "0");
        const dd = String(today.getDate()).padStart(2, "0");
        const todayStr = `${yyyy}-${mm}-${dd}`;

        // Tính thời gian hiện tại để set mặc định
        const hh = String(today.getHours()).padStart(2, "0");
        const min = String(today.getMinutes()).padStart(2, "0");
        const nowStr = `${todayStr}T${hh}:${min}`;

        // Gán giới hạn cho tất cả input datetime-local
        document.querySelectorAll(".updatedAtInput").forEach(input => {
            input.min = `${todayStr}T00:00`;
            input.max = `${todayStr}T23:59`;
            input.value = nowStr; // set mặc định = giờ hiện tại
        });
    });
</script>

</body>
</html>
