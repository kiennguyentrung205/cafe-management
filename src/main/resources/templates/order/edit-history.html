<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: common-head(
            pageTitle='Order Edit History',
            pageSpecificCss=~{:: .page-css}
          )}"></head>
<th:block class="page-css">
    <link rel="stylesheet" href="/assets/css/order/edit.css">
</th:block>
<body>
<div th:replace="~{fragments/common :: navbar-main}"></div>

<!-- Main Content -->
<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Edit Order History</h2>
    </div>
    <table>
        <thead>
        <tr>
            <th>Order#</th>
            <th>Staff</th>
            <th>Products</th>
            <th>Note</th>
            <th>Status</th>
            <th>Updated At</th>
            <th>Updated By</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.orderId}"></td>

            <!-- Staff (creator of order) -->
            <td th:text="${order.staff != null ? order.staff.name : '-'}"></td>

            <!-- Products -->
            <td>
                <ul style="list-style:none;padding:0;margin:0;">
                    <li th:each="item : ${order.orderItems}"
                        th:text="${item.product != null ? item.product.proName + ' × ' + item.quantity : '-'}"></li>
                </ul>
            </td>

            <!-- Note -->
            <td>
                <ul style="list-style: none; padding: 0; margin: 0;">
                    <li th:each="item : ${order.orderItems}"
                        th:text="${item.note != null && item.note != '' ? item.note : '-'}"></li>
                </ul>
            </td>

            <!-- Status -->
            <td th:text="${order.status}"></td>

            <!-- Updated At -->
            <td th:text="${#temporals.format(order.updatedAt, 'dd/MM/yyyy HH:mm:ss')}"></td>

            <!-- Updated By -->
            <td th:text="${order.updatedBy != null ? order.updatedBy.name : '-'}"></td>
        </tr>

        <tr th:if="${orders == null or orders.isEmpty()}">
            <td colspan="7" class="text-center text-muted py-3">
                There are not any history orders.
            </td>
        </tr>
        </tbody>
    </table>

    <nav aria-label="Order pagination"
         th:if="${orders != null and !orders.isEmpty() and totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/order/edit-history(page=${currentPage - 1})}"
                   aria-label="Previous">Prev</a>
            </li>

            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/order/edit-history(page=${i})}"
                   th:text="${i}"></a>
            </li>

            <li class="page-item"
                th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/order/edit-history(page=${currentPage + 1})}"
                   aria-label="Next">Next</a>
            </li>
        </ul>
    </nav>
</div>
<script src="/assets/js/bootstrap.bundle.min.js"></script>
<div th:insert="~{layout/footer}"></div>
</body>
</html>
