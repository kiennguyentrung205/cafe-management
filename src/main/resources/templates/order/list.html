<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        table.table {
            background-color: white;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        table.table td, table.table th {
            border-color: black;
            padding: 25px 30px;
            font-size: 16px;
            vertical-align: middle;
        }

        table.table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #fafafa;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .pagination a {
            color: #007bff;
            padding: 6px 12px;
            margin: 0 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-decoration: none;
        }

        .pagination a.active {
            background-color: #007bff;
            color: white;
        }

        .pagination a:hover {
            background-color: #0056b3;
            color: white;
        }

        .status-pending {
            color: orange !important;
            font-weight: bold;
        }

        /* Modal chỉnh sửa */
        .modal-dialog {
            max-width: 110vw;
            margin: auto;
        }

        .modal-content {
            max-height: 100%;
            overflow-y: hidden;
            transform: scale(0.8);
        }

        .customer-info {
            padding-left: 5%;
        }

        .customer-section {
            display: flex;
            justify-content: center; /* căn giữa */
            align-items: flex-start;
            gap: 40px; /* khoảng cách giữa bảng và ảnh */
        }

        .customer-table {
            flex: 1;
            padding-left: 5%;

        }

        .customer-table table {
            width: 700px;
            font-size: 14px;
        }

        .customer-photo {
            width: 160px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            padding-right: 15%;
        }

        .customer-photo img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ddd;
        }

        .customer-photo span {
            margin-top: 10px;
            font-weight: 500;
            color: #555;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div th:replace="fragment/frag :: order-sidebar('list')"></div>


<!-- Main content -->
<div class="main-content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="m-0">Order List</h2>
        <a href="/order/history-list" class="btn btn-outline-secondary">
         History
        </a>
    </div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>#</th>
            <th>Customer</th>
            <th>Staff</th>
            <th>Status</th>
            <th>Total Price</th>
            <th>Created At</th>
            <th>Points Used</th>
            <th>Voucher</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}"
            th:data-cust-id="${order.customer.cusId}"
            th:data-cust-name="${order.customer.name}"
            th:data-cust-phone="${order.customer.phoneNumber}"
            th:data-cust-email="${order.customer.email}"
            th:data-cust-address="${order.customer.address}"
            th:data-cust-photo="@{'/uploads/' + ${order.customer.img}}">
            <td th:text="${order.orderId}"></td>
            <td th:text="${order.customer.name}"></td>
            <td th:text="${order.manager != null ? order.manager.name : 'N/A'}"></td>
            <td th:text="${order.status}"
                th:classappend="${order.status == 'Pending'} ? 'status-pending' : ''"></td>
            <td th:text="${#strings.concat(#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT'), ' VND')}"></td>
            <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${order.pointsUsed}"></td>
            <td th:text="${order.voucher != null ? order.voucher.voucherName : 'None'}"></td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <nav aria-label="Order pagination">
        <ul class="pagination justify-content-center">
            <!-- Previous -->
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/order/list(page=${currentPage - 1})}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <!-- Page numbers -->
            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/order/list(page=${i})}" th:text="${i}"></a>
            </li>

            <!-- Next -->
            <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/order/list(page=${currentPage + 1})}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>
        </ul>
    </nav>

</div>

<!-- Modal hiển thị chi tiết -->
<div class="modal fade" id="orderDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Order Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <h6>Order Information</h6>
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Customer</th>
                        <th>Manager</th>
                        <th>Status</th>
                        <th>Product</th>
                        <th>Total Price</th>
                        <th>Created At</th>
                        <th>Points Used</th>
                        <th>Voucher</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr id="order-detail-row"></tr>
                    </tbody>

                </table>

                <h6 class="customer-info">Customer Information</h6>
                <div class="customer-section">
                    <div class="customer-table">
                        <table class="table table-bordered">
                            <tr><th>ID</th><td id="cust-id"></td></tr>
                            <tr><th>Name</th><td id="cust-name"></td></tr>
                            <tr><th>Phone</th><td id="cust-phone"></td></tr>
                            <tr><th>Email</th><td id="cust-email"></td></tr>
                            <tr><th>Address</th><td id="cust-address"></td></tr>
                        </table>
                    </div>
                    <div class="customer-photo">
                        <img id="cust-photo" alt="Customer Photo">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll(".main-content table.table.table-striped tbody tr").forEach(row => {
        if (row.querySelectorAll("td").length === 0) return;

        row.addEventListener("click", () => {
            const orderId = row.querySelector("td")?.textContent?.trim();

            fetch(`/order/detail/${orderId}`)
                .then(res => res.json())
                .then(data => {
                    if (!data.success) {
                        alert(data.message || "Order not found");
                        return;
                    }

                    const o = data.order;
                    const c = data.customer;

                    // tạo danh sách sản phẩm (mỗi sản phẩm 1 dòng xuống)
                    const productNames = o.products.length > 0
                        ? o.products.map(p =>
                            `<div>${p.name} — ${Number(p.price).toLocaleString()} VND × ${p.quantity}</div>`
                        ).join("")
                        : `<div class='text-muted'>No products</div>`;


                    // hiển thị order info
                    document.getElementById("order-detail-row").innerHTML = `
                    <td>${o.id}</td>
                    <td>${o.customer}</td>
                    <td>${o.manager}</td>
                    <td>${o.status}</td>
                    <td>${productNames}</td>
                    <td>${o.totalPrice.toLocaleString()} VND</td>
                    <td>${new Date(o.date).toLocaleString('vi-VN')}</td>
                    <td>${o.pointsUsed}</td>
                    <td>${o.voucher}</td>
                `;

                    // hiển thị customer info
                    document.getElementById("cust-id").textContent = c.id || "N/A";
                    document.getElementById("cust-name").textContent = c.name || "N/A";
                    document.getElementById("cust-phone").textContent = c.phone || "N/A";
                    document.getElementById("cust-email").textContent = c.email || "N/A";
                    document.getElementById("cust-address").textContent = c.address || "N/A";
                    document.getElementById("cust-photo").src = c.img ? `/uploads/${c.img}` : "/uploads/default-user.jpg";

                    new bootstrap.Modal(document.getElementById("orderDetailModal")).show();
                })
                .catch(err => {
                    console.error(err);
                    alert("Error loading order detail");
                });
        });
    });
</script>


</body>
</html>
