<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* === SIDEBAR === */
        .sidebar {
            width: 120px;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            gap: 10px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            background-color: #f5f5f5;
            padding: 10px 0;
            width: 100px;
            border-radius: 15px;
            font-size: 12px;
            transition: 0.25s;
            text-align: center;
        }

        .menu-item i {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .menu-item:hover {
            background-color: #ff4d4d;
            color: white;
            transform: scale(1.05);
        }

        .menu-item.active {
            background-color: #ff4d4d;
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
            margin-bottom: 20px;
        }

        /* === MAIN CONTENT === */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            background-color: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #e6e6e6;
            padding: 10px;
            text-align: center;
        }

        td {
            text-align: center;
            padding: 10px;
            vertical-align: middle;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .pagination a {
            color: #007bff;
            padding: 6px 12px;
            margin: 0 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-decoration: none;
        }

        .pagination a.active {
            background-color: #007bff;
            color: white;
        }

        .pagination a:hover {
            background-color: #0056b3;
            color: white;
        }

        .status-completed {
            color: green;
            font-weight: bold;
        }

        .status-inprogress {
            color: orange;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- === Sidebar === -->
<div class="sidebar">
    <a href="/dashboard" class="menu-item">
        <i class="bi bi-house-door"></i>
        <span>Dashboard</span>
    </a>
    <a href="/sales" class="menu-item">
        <i class="bi bi-bar-chart-line"></i>
        <span>Sales</span>
    </a>
    <a href="/order/order-list" class="menu-item active">
        <i class="bi bi-list-ul"></i>
        <span>Order List</span>
    </a>

    <div class="sidebar-bottom">
        <a href="/logout" class="menu-item logout">
            <i class="bi bi-box-arrow-right"></i>
            <span>Log Out</span>
        </a>
    </div>
</div>

<!-- === Main Content === -->
<div class="main-content">
    <h2>Order List</h2>

    <table>
        <thead>
        <tr>
            <th>Order#</th>
            <th>Name</th>
            <th>Date</th>
            <th>Drink</th>
            <th>Price</th>
            <th>Voucher</th>
            <th>Total</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.orderId}"></td>
            <td th:text="${order.customerName}"></td>
            <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}"></td>
            <td th:text="${order.drinkDescription}"></td>
            <td th:text="${#numbers.formatDecimal(order.price, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
            <td th:text="${order.voucherName != null ? order.voucherName : 'None'}"></td>
            <td th:text="${#numbers.formatDecimal(order.total, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
            <td th:text="${order.status}"
                th:classappend="${order.status == 'Completed'} ? 'status-completed' : 'status-inprogress'"></td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination">
        <a th:href="@{/order/view(page=1)}">&lt;&lt;</a>
        <a th:each="i : ${#numbers.sequence(1, totalPages)}"
           th:href="@{/order/view(page=${i})}"
           th:text="${i}"
           th:classappend="${i == currentPage} ? 'active' : ''"></a>
        <a th:href="@{/order/view(page=${totalPages})}">&gt;&gt;</a>
    </div>

    <!-- === Popup Order Details === -->
    <!-- === Popup Order Details === -->
    <div class="order-details-popup" id="order-details-popup" style="display: none;">
        <h3>Order Details</h3>
        <button onclick="closePopup()" id="close-btn" style="font-size: 20px; position: absolute; top: 10px; right: 10px; border: none; background: transparent; cursor: pointer;">&times;</button>

        <table>
            <tr>
                <td>Order#:</td>
                <td id="popup-order-id"></td>
            </tr>
            <tr>
                <td>Date:</td>
                <td id="popup-order-date"></td>
            </tr>
            <tr>
                <td>Drink:</td>
                <td id="popup-drink"></td>
            </tr>
            <tr>
                <td>Price:</td>
                <td id="popup-price"></td>
            </tr>
            <tr>
                <td>Voucher:</td>
                <td id="popup-voucher"></td>
            </tr>
            <tr>
                <td>Total:</td>
                <td id="popup-total"></td>
            </tr>
            <tr>
                <td>Status:</td>
                <td id="popup-status"></td>
            </tr>
        </table>

        <h4>Customer</h4>
        <table>
            <tr>
                <td>ID:</td>
                <td id="popup-customer-id" th:text="${order.customer.cusId}"></td>
            </tr>
            <tr>
                <td>Name:</td>
                <td id="popup-customer-name" th:text="${order.customer.name}"></td>
            </tr>
            <tr>
                <td>Phone:</td>
                <td id="popup-customer-phone" th:text="${order.customer.phoneNumber}"></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td id="popup-customer-email" th:text="${order.customer.email}"></td>
            </tr>
            <tr>
                <td>Address:</td>
                <td id="popup-customer-address" th:text="${order.customer.address}"></td>
            </tr>
        </table>

        <div id="popup-customer-image" th:if="${order.customer.img != null}">
            <img th:src="@{${order.customer.img}}" alt="Customer Image" style="width: 150px; height: 150px;">
        </div>
    </div>
</div>
<script>
    function closePopup() {
        document.getElementById('order-details-popup').style.display = 'none';
    }
</script>
</body>
</html>
