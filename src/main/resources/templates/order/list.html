<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order List</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 120px;
            background-color: #ffffff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 25px;
            gap: 10px;
        }

        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #333;
            background-color: #f5f5f5;
            padding: 10px 0;
            width: 100px;
            border-radius: 15px;
            font-size: 12px;
            transition: 0.25s;
            text-align: center;
        }

        .menu-item i {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .menu-item:hover {
            background-color: #ff4d4d;
            color: white;
            transform: scale(1.05);
        }

        .menu-item.active {
            background-color: #ff4d4d;
            color: white;
        }

        .sidebar-bottom {
            margin-top: auto;
            margin-bottom: 20px;
        }

        .main-content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        table.table {
            background-color: white;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        table.table td, table.table th {
            border-color: black;
            padding: 25px 30px;
            font-size: 16px;
            vertical-align: middle;
        }

        table.table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: #fafafa;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .pagination {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }

        .pagination a {
            color: #007bff;
            padding: 6px 12px;
            margin: 0 4px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-decoration: none;
        }

        .pagination a.active {
            background-color: #007bff;
            color: white;
        }

        .pagination a:hover {
            background-color: #0056b3;
            color: white;
        }

        .status-completed {
            color: green !important;
            font-weight: bold;
        }

        .status-pending {
            color: orange !important;
            font-weight: bold;
        }

        .status-canceled {
            color: red !important;
            font-weight: bold;
        }

        /* Modal chỉnh sửa */
        .modal-dialog {
            max-width: 90vw;
        }

        .modal-content {
            max-height: 80vh;
            overflow-y: auto;
        }

        .customer-info {
            padding-left: 5%;
        }

        .customer-section {
            display: flex;
            justify-content: center; /* căn giữa */
            align-items: flex-start;
            gap: 40px; /* khoảng cách giữa bảng và ảnh */
        }

        .customer-table {
            flex: 1;
            padding-left: 5%;

        }

        .customer-table table {
            width: 700px;
            font-size: 14px;
        }

        .customer-photo {
            width: 160px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            padding-right: 15%;
        }

        .customer-photo img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #ddd;
        }

        .customer-photo span {
            margin-top: 10px;
            font-weight: 500;
            color: #555;
        }
    </style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <a href="/order/create" class="menu-item">
        <i class="bi bi-house-door"></i>
        <span>Dashboard</span>
    </a>
    <a href="/sales" class="menu-item">
        <i class="bi bi-bar-chart-line"></i>
        <span>Sales Amount</span>
    </a>
    <a href="/order/list" class="menu-item active">
        <i class="bi bi-list-ul"></i>
        <span>Order List</span>
    </a>
    <div class="sidebar-bottom">
        <a href="/logout" class="menu-item logout">
            <i class="bi bi-box-arrow-right"></i>
            <span>Log Out</span>
        </a>
    </div>
</div>

<!-- Main content -->
<div class="main-content">
    <h2>Order List</h2>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>#</th>
            <th>Customer</th>
            <th>Manager</th>
            <th>Status</th>
            <th>Total Price</th>
            <th>Date</th>
            <th>Points Used</th>
            <th>Voucher</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}"
            th:data-cust-id="${order.customer.cusId}"
            th:data-cust-name="${order.customer.name}"
            th:data-cust-phone="${order.customer.phoneNumber}"
            th:data-cust-email="${order.customer.email}"
            th:data-cust-address="${order.customer.address}"
            th:data-cust-photo="@{'/uploads/' + ${order.customer.img}}">
            <td th:text="${order.orderId}"></td>
            <td th:text="${order.customer.name}"></td>
            <td th:text="${order.manager != null ? order.manager.name : 'N/A'}"></td>
            <td th:text="${order.status}"></td>
            <td th:text="${#strings.concat(#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT'), ' VND')}"></td>
            <td th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${order.pointsUsed}"></td>
            <td th:text="${order.voucher != null ? order.voucher.voucherName : 'Không có'}"></td>
        </tr>
        </tbody>
    </table>

    <div class="pagination">
        <a th:href="@{/order/list(page=1)}">&lt;&lt;</a>
        <a th:each="i : ${#numbers.sequence(1, totalPages)}"
           th:href="@{/order/list(page=${i})}"
           th:text="${i}"
           th:classappend="${i == currentPage} ? ' active' : ''"></a>
        <a th:href="@{/order/list(page=${totalPages})}">&gt;&gt;</a>
    </div>
</div>

<!-- Modal hiển thị chi tiết -->
<div class="modal fade" id="orderDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Order Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <h6>Order Information</h6>
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Customer</th>
                        <th>Manager</th>
                        <th>Status</th>
                        <th>Total Price</th>
                        <th>Date</th>
                        <th>Points Used</th>
                        <th>Voucher</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr id="order-detail-row"></tr>
                    </tbody>
                </table>

                <h6 class="customer-info">Customer Information</h6>
                <div class="customer-section">
                    <div class="customer-table">
                        <table class="table table-bordered">
                            <tr><th>ID</th><td id="cust-id"></td></tr>
                            <tr><th>Name</th><td id="cust-name"></td></tr>
                            <tr><th>Phone</th><td id="cust-phone"></td></tr>
                            <tr><th>Email</th><td id="cust-email"></td></tr>
                            <tr><th>Address</th><td id="cust-address"></td></tr>
                        </table>
                    </div>
                    <div class="customer-photo">
                        <img id="cust-photo" alt="Customer Photo">
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll("tbody tr").forEach(row => {
        row.addEventListener("click", () => {
            const cells = row.querySelectorAll("td");
            const order = {
                id: cells[0].textContent,
                customer: cells[1].textContent,
                manager: cells[2].textContent,
                status: cells[3].textContent,
                price: cells[4].textContent,
                date: cells[5].textContent,
                points: cells[6].textContent,
                voucher: cells[7].textContent
            };

            document.getElementById("order-detail-row").innerHTML = `
            <td>${order.id}</td>
            <td>${order.customer}</td>
            <td>${order.manager}</td>
            <td>${order.status}</td>
            <td>${order.price}</td>
            <td>${order.date}</td>
            <td>${order.points}</td>
            <td>${order.voucher}</td>
        `;

            document.getElementById("cust-id").textContent = row.dataset.custId || "N/A";
            document.getElementById("cust-name").textContent = row.dataset.custName || "N/A";
            document.getElementById("cust-phone").textContent = row.dataset.custPhone || "N/A";
            document.getElementById("cust-email").textContent = row.dataset.custEmail || "N/A";
            document.getElementById("cust-address").textContent = row.dataset.custAddress || "N/A";
            document.getElementById("cust-photo").src = row.dataset.custPhoto || "/assets/img/default-user.png";

            new bootstrap.Modal(document.getElementById("orderDetailModal")).show();
        });
    });
</script>

</body>
</html>
