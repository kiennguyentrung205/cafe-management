<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/common :: common-head(
            pageTitle='Banner',
            pageSpecificCss=~{:: .page-css}
          )}"></head>

<th:block class="page-css">
    <link rel="stylesheet" href="/assets/css/dashboard/staff/list.css">
</th:block>
<body>
<div th:replace="~{fragments/common :: navbar-main}"></div>
<!-- Main Content -->
<div class="container my-5">

    <!-- Header Card: Title, Search, and Actions -->
    <div class="card p-4 mb-4">
        <div class="row g-3">
            <!-- Title -->
            <div class="col-12 col-md-4">
                <h2 class="fw-bold mb-0">Banner Manager</h2>
            </div>


            <div class="col-12 col-md-8 d-flex justify-content-md-end gap-2">
                <a th:href="@{/dashboard/banners/create}" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add New Banner
                </a>
            </div>

            <div th:if="${completeInfo}" class="alert alert-success">
                <span th:text="${completeInfo}"></span>
            </div>
            <div th:if="${errorInfo}" class="alert alert-danger">
                <span th:text="${errorInfo}"></span>
            </div>

            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Image</th>
                    <th>Title</th>
                    <th>Order_Number</th>
                    <th>Active</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="banner : ${banners}">
                    <td th:text="${banner.id}">1</td>
                    <td>
                        <img th:src="@{${banner.imagePath}}" alt="Banner" style="max-height: 50px; width: auto;">
                    </td>
                    <td th:text="${banner.title}">Promotion Title</td>

                    <td th:text="${banner.orderNumber}">1</td>
                    <td class="p-3">
                                <span th:text="${banner.isActive ? 'Active' : 'Not Active'}"
                                      th:classappend="${banner.isActive ? 'text-success' : 'text-danger'}"
                                      class="fw-bold"></span>
                    </td>
                    <td>
                        <a th:href="@{/dashboard/banners/edit/{id}(id=${banner.id})}"
                           class="btn btn-sm btn-info">Edit</a>
                        <a th:href="@{'/dashboard/banners/delete/' + ${banner.id}}"
                           onclick="return confirm('Are you sure you want to delete Banner: ' + '?' )"
                           class="btn btn-sm btn-danger">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
