<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragment/frag :: head">
    <title>Delete Staff</title>
</head>
<body>
<div th:replace="fragment/frag :: navbar"></div>

<div class="container mt-5">
    <h2>Delete Staff</h2>
    <p></p>

    <!-- Thông tin staff dạng list -->
    <ul class="list-group mb-4">
        <li class="list-group-item">
            <strong>Photo:</strong><br>
            <img th:if="${staff.img != null}" th:src="@{${staff.img}}" class="img-thumbnail" width="120">
        </li>
        <li class="list-group-item"><strong>ID:</strong> <span th:text="${staff.managerId}"></span></li>
        <li class="list-group-item"><strong>Name:</strong> <span th:text="${staff.name}"></span></li>
        <li class="list-group-item"><strong>Email:</strong> <span th:text="${staff.email}"></span></li>
        <li class="list-group-item"><strong>Phone:</strong> <span th:text="${staff.phoneNumber}"></span></li>
        <li class="list-group-item"><strong>Address:</strong> <span th:text="${staff.address}"></span></li>
        <li class="list-group-item"><strong>Date of Birth:</strong> <span th:text="${staff.dateOfBirth}"></span></li>
        <li class="list-group-item"><strong>Role:</strong> <span th:text="${staff.role.roleName}"></span></li>
<!--        <li class="list-group-item"><strong>Username:</strong> <span th:text="${staff.username}"></span></li>-->

    </ul>

    <div class="d-flex gap-2">
        <!-- Nút mở Modal -->
        <!-- Nút mở Modal -->
        <button class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirmDeleteModal">
            Delete
        </button>

        <!-- Modal -->
        <div class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-labelledby="confirmDeleteModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="confirmDeleteModalLabel">Confirm Delete</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        Are you sure you want to delete <strong th:text="${staff.name}"></strong>?
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>

                        <!-- FORM POST để gọi đúng doDelete() -->
                        <form th:action="@{/dashboard/staff/delete/{id}(id=${staff.managerId})}" method="post">
<!--                            <input type="hidden" th:field="*{managerId}">-->
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<div th:replace="fragment/frag :: footer"></div>
</body>
</html>
