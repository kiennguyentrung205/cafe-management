<html>
<head th:replace="~{fragment/frag :: head}">
    <title>Add New Staff</title>
</head>
<body class="bg-light">
<div th:insert="~{fragment/frag :: navbar}"></div>

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title mb-4">Add New Staff</h2>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- Form chính -->
            <form th:action="@{/dashboard/staff/save}" method="post" th:object="${staff}" enctype="multipart/form-data" class="needs-validation" novalidate>

                <!-- Photo -->
                <div class="mb-3">
                    <label for="photo" class="form-label fw-bold">Photo</label>
                    <input class="form-control" type="file" id="photo" name="photo" accept="image/*" onchange="previewImage(event)">
                    <img id="previewPhoto" class="img-thumbnail mt-2" style="max-width: 150px;">
                </div>

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Name</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                    <div class="invalid-feedback">Name is required.</div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" required>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>

                <!-- Phone Number -->
                <div class="mb-3">
                    <label for="phoneNumber" class="form-label fw-bold">Phone Number</label>
                    <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" pattern="^[0-9]{9,12}$" required>
                    <div class="invalid-feedback">Phone number must be 9-12 digits.</div>
                </div>

                <!-- Address -->
                <div class="mb-3">
                    <label for="address" class="form-label fw-bold">Address</label>
                    <input type="text" class="form-control" id="address" th:field="*{address}" required>
                    <div class="invalid-feedback">Please enter a valid address.</div>
                </div>

                <!-- Date of Birth -->
                <div class="mb-3">
                    <label for="dateOfBirth" class="form-label fw-bold">Date of Birth</label>
                    <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}" required>
                    <div class="invalid-feedback">Please enter a valid date of birth</div>
                </div>

                <!-- Role -->
                <div class="mb-3">
                    <label for="role" class="form-label fw-bold">Role</label>
                    <select class="form-select" id="role" name="roleId" required>
                        <option value="" disabled>-- Chọn Role --</option>
                        <option th:each="r : ${roles}"
                                th:value="${r.roleId}"z
                                th:text="${r.roleName}"
                                th:selected="${staff.role != null and r.roleId == staff.role.roleId}">
                        </option>
                    </select>
                    <div class="invalid-feedback">Please select a role.</div>
                </div>



                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">Username</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" required>
                    <div class="invalid-feedback">Please enter a valid username</div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control" id="password" th:field="*{password}" required>
                    <div class="invalid-feedback">Please enter a valid password</div>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">Create</button>
                </div>

            </form>
        </div>
    </div>
</div>

<div th:replace="fragment/frag :: footer"></div>

<<script>
    // Bootstrap Validation
    (function () {
        'use strict'
        const forms = document.querySelectorAll('.needs-validation')

        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()

    // Preview Image
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('previewPhoto');
            output.src = reader.result;
        }
        reader.readAsDataURL(event.target.files[0]);
    }
</script>

</body>
</html>
