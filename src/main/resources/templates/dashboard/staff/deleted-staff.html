<html>
<head th:replace="fragment/frag :: head">
    <title>Deleted Staff</title>
</head>
<body class="bg-light">
<div th:replace="fragment/frag :: navbar"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Deleted Staff</h2>
        <a th:href="@{/dashboard/staff}" class="btn btn-secondary">Back to Staff List</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead class="table-dark">
                <tr>
                    <th class="text-center">Photo</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Is Active</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="staff : ${staffs}">
                    <td class="text-center">
                        <img th:src="${staff.img != null ? staff.img : '/img/no-image.png'}"
                             style="width: 60px; height: 60px; object-fit: cover; border-radius: 5px;">
                    </td>
                    <td th:text="${staff.managerId}"></td>
                    <td th:text="${staff.name}"></td>
                    <td th:text="${staff.email}"></td>
                    <td th:text="${staff.phoneNumber}"></td>
                    <td th:text="${staff.role != null ? staff.role.roleName : 'Unknown'}"></td>
                    <td th:text="${staff.isActive ? 'Active' : 'Not Active'}"></td>

                    <td class="text-center">
                        <!-- Restore Button -->
                        <a th:href="@{/dashboard/staff/restore/{id}(id=${staff.managerId})}"
                           class="btn btn-sm btn-success">Restore</a>

                        <!-- Delete Forever Button -->
                        <a th:href="@{/dashboard/staff/delete-forever/{id}(id=${staff.managerId})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Are you sure you want to permanently delete this staff? This action cannot be undone!');">
                            Delete
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(staffs)}">
                    <td colspan="7" class="text-center text-muted">No deleted staff found.</td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>
</div>

<div th:replace="fragment/frag :: footer"></div>
</body>
</html>
