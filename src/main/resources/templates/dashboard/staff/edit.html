<html>
<head th:replace="~{fragment/frag :: head}">
    <title>Edit Staff</title>
</head>
<body class="bg-light">
<div th:insert="~{fragment/frag :: navbar}"></div>
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-body">
            <h2 class="card-title mb-4">Edit Staff</h2>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/dashboard/staff/save}" method="post" th:object="${staff}" enctype="multipart/form-data" class="needs-validation" novalidate>

            <!-- Hidden ID -->
                <input type="hidden" th:field="*{managerId}">

                <!-- Photo -->
                <div class="mb-3">
                    <label for="photo" class="form-label fw-bold">Photo</label>
                    <input class="form-control" type="file" id="photo" name="photo" accept="image/*" onchange="previewImage(event)">
                    <img th:if="${staff.img != null}" th:src="@{${staff.img}}"
                         class="img-thumbnail mt-2" width="100" height="100">
                </div>

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Name</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                    <div class="invalid-feedback">Name is required.</div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control" id="email" th:field="*{email}" required>
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label for="phoneNumber" class="form-label fw-bold">Phone Number</label>
                    <input type="tel" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" required>
                    <div class="invalid-feedback">Phone number must be 9-12 digits.</div>
                </div>

                <!-- Address -->
                <div class="mb-3">
                    <label for="address" class="form-label fw-bold">Address</label>
                    <input type="text" class="form-control" id="address" th:field="*{address}">
                    <div class="invalid-feedback">Please enter a valid address.</div>
                </div>

                <!-- Date of Birth -->
                <div class="mb-3">
                    <label for="dateOfBirth" class="form-label fw-bold">Date of Birth</label>
                    <input type="date" class="form-control" id="dateOfBirth"
                           th:value="${staff.dateOfBirth != null ? staff.dateOfBirth.toString() : ''}"
                           name="dateOfBirth">
                    <div class="invalid-feedback">Please enter a valid date of birth</div>
                </div>

                <!-- Role -->
                <div class="mb-3">
                    <label for="role" class="form-label fw-bold">Role</label>
                    <select class="form-select" id="role" name="roleId" required>
                        <option value="" disabled>-- Chọn Role --</option>
                        <option th:each="r : ${roles}"
                                th:value="${r.roleId}"
                                th:text="${r.roleName}"
                                th:selected="${staff.role != null and staff.role.roleId == r.roleId}">
                        </option>
                    </select>
                    <div class="invalid-feedback">Please select a role.</div>
                </div>

                <!-- Username -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold">Username</label>
                    <input type="text" class="form-control" id="username" th:field="*{username}" required>
                    <div class="invalid-feedback">Please enter a valid username</div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control" id="password"
                           th:value="${staff.password}" name="password" required>
                </div>

                <!-- Actions -->
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary me-2">Save</button>
                    <button type="reset" class="btn btn-secondary">Clear</button>
                </div>
            </form>

        </div>
    </div>
</div>
<div th:replace="fragment/frag :: footer"></div>

<<script>

    // Preview Image
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = function(){
            const output = document.getElementById('previewPhoto');
            output.src = reader.result;
        }
        reader.readAsDataURL(event.target.files[0]);
    }
</script>
</body>
</html>
