<html>
<head th:replace="fragment/frag :: head">
    <title>Staff Dashboard</title>
</head>
<body class="bg-light">
<div th:replace="fragment/frag :: navbar"></div>

<div class="container mt-4">
    <!-- Title -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="fw-bold">Staff List</h2>

        <a th:href="@{/dashboard/staff/new}" class="btn btn-success">+ Add New Staff</a>
    </div>

    <!-- Search Bar -->
    <form class="d-flex mb-3" role="search" th:action="@{/dashboard/staff}" method="get">
        <input class="form-control me-2" type="search" name="keyword" placeholder="Search by name, email or role..." th:value="${keyword}" aria-label="Search">
        <td class="text-center">
            <button class="btn btn-primary" type="submit">Search</button>
            <a th:href="@{/dashboard/staff/deleted}" class="btn btn-secondary me-2">
                <i class="bi bi-trash"></i> Trash
            </a>
        </td>

    </form>


    <!-- Staff Table -->
    <div th:if="${notFound}" class="alert alert-warning">
        <span th:text="${notFound}"></span>
    </div>

    <div th:if="${staffs != null}">
    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead class="table-dark">
                <tr>
                    <th class="text-center">Photo</th>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Role</th>
                    <th>Is Active</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="staff : ${staffs}">
                    <td class="text-center">
                        <img th:src="${staff.img != null ? staff.img : '/img/no-image.png'}"
                             style="width: 60px; height: 60px; object-fit: cover; border-radius: 5px;">
                    </td>

                    <td th:text="${staff.managerId}">1</td>
                    <td><a th:text="${staff.name}">Nguyen Van A</a></td>
                    <td th:text="${staff.email}">abc@gmail.com</td>
                    <td th:text="${staff.phoneNumber}">0123456789</td>
                    <td th:text="${staff.role != null ? staff.role.roleName : 'Unknown'}"></td>
                    <td th:text="${staff.isActive ? 'Active' : 'Not Active'}"></td>
                    <td class="text-center">
                        <a th:href="@{/dashboard/staff/{id}(id=${staff.managerId})}" class="btn btn-outline-secondary">Detail</a>
                        <a th:href="@{/dashboard/staff/edit/{id}(id=${staff.managerId})}" class="btn btn-sm btn-warning">Edit</a>

                        <!-- Sửa nút Delete -->
                        <button class="btn btn-sm btn-danger btn-delete"
                                th:data-id="${staff.managerId}"
                                th:data-name="${staff.name}"
                                th:data-email="${staff.email}"
                                th:data-phoneNumber="${staff.phoneNumber}"
                                th:data-role="${staff.role.roleName}">

                            Delete
                        </button>
                    </td>
                </tr>

                </tbody>
            </table>

            <!-- Pagination -->
            <div class="d-flex justify-content-center mt-3">
                <nav aria-label="Page navigation">
                    <ul class="pagination">
                        <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/dashboard/staff(page=${currentPage - 1})}" aria-label="Previous">
                                <span aria-hidden="true">&laquo;</span>
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link"
                               th:href="@{/dashboard/staff(page=${i})}" th:text="${i}"></a>
                        </li>

                        <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/dashboard/staff(page=${currentPage + 1})}"aria-label="Next">
                                <span aria-hidden="true">&raquo;</span>
                                </a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </div>
</div>
    <div th:if="${staffs == null}">
    </div>

<div th:replace="fragment/frag :: footer"></div>

<!-- Modal Xác nhận Xóa -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Confirm Delete</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to delete this staff?</p>
                <ul>
                    <li><strong>Name:</strong> <span id="modalName"></span></li>
                    <li><strong>Email:</strong> <span id="modalEmail"></span></li>
                    <li><strong>Phone Number:</strong> <span id="modalPhoneNumber"></span></li>
                    <li><strong>Role:</strong> <span id="modalRole"></span></li>
                </ul>
            </div>

            <div class="modal-footer">
                <form id="deleteForm" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </div>

        </div>
    </div>
</div>

<!-- JavaScript xử lý Delete -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const deleteButtons = document.querySelectorAll(".btn-delete");

        deleteButtons.forEach(btn => {
            btn.addEventListener("click", function () {
                const id = this.getAttribute("data-id");
                const name = this.getAttribute("data-name");
                const email = this.getAttribute("data-email");
                const phoneNumber = this.getAttribute("data-phoneNumber");
                const role = this.getAttribute("data-role");

                document.getElementById("modalName").textContent = name;
                document.getElementById("modalEmail").textContent = email;
                document.getElementById("modalPhoneNumber").textContent = phoneNumber;
                document.getElementById("modalRole").textContent = role;

                // GÁN action vào form thay vì href
                document.getElementById("deleteForm").action = `/dashboard/staff/delete/${id}`;

                const modal = new bootstrap.Modal(document.getElementById("deleteModal"));
                modal.show();
            });
        });
    });
</script>

</div>>
</body>
</html>
