<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác Nhận Đặt Bàn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"/>

    <style>
        body {
            background-color: #f4f7f6;
        }

        .form-label i {
            margin-right: 8px;
        }
    </style>
</head>
<body>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-primary text-white text-center p-4 rounded-top-4">
                    <h2 class="mb-0">Table Booking Form</h2>
                    <h4 class="fw-light mt-2" th:text="'Table ID: '+ ${table.tableId}">..</h4>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form method="post" th:action="@{/table/booking/new}" th:object="${tableBooking}">
                        <input th:field="*{table}" th:value="${table}" type="hidden"/>

                        <div class="mb-3">
                            <label class="form-label" for="customerName"><i class="fas fa-user"></i>Fullname</label>
                            <input class="form-control" id="customerName" readonly th:field="*{customer.name}"
                                   th:value="${loggedCustomer.name}" type="text">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="phoneNumber"><i class="fas fa-phone"></i>Phone Number</label>
                            <input class="form-control" id="phoneNumber" placeholder="Vd: 0987654321" readonly
                                   th:field="*{customer.phoneNumber}" type="tel">
                        </div>

                        <div class="row mb-3">
                            <label class="form-label" for="bookingDateTime">Chọn ngày & giờ đặt</label>
                            <input class="form-control" id="bookingDateTime"
                                   required
                                   th:field="*{bookingTime}"
                                   type="datetime-local">
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="notes"><i class="fas fa-pencil-alt"></i>Ghi chú (tùy
                                chọn)</label>
                            <textarea class="form-control" id="notes" placeholder="Vd: Cho tôi một ghế trẻ em..."
                                      rows="3"></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button class="btn btn-primary btn-lg" type="submit">Book</button>
                            <a class="btn btn-outline-secondary" th:href="@{/table/list}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
